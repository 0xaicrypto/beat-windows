name: Update Unix feed and forum

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: unix-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build feed
        run: node scripts/build-feed.mjs
      - name: Build discussions
        run: node scripts/build-discussions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit data
        run: |
          if git diff --quiet -- feed.xml data/feed.json data/discussions.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml data/feed.json data/discussions.json
          git commit -m "Update Unix feed"
          git push
